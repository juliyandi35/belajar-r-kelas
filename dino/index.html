<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Dino Jalan-Jalan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root {
    --bg: #eaf4f0;
    --ink: #1f3b2a;
    --muted: #4d6b5a;
    --panel: #ffffff;
    --line: #1f3b2a;
    --accent: #f2994a;
    --sky-top: #9fd8f0;
    --sky-bottom: #d9f1f7;
    --cloud: #ffffff;
    --grass: #58b35c;
    --grass-dark: #3d8a45;
    --dirt: #c98f5a;
    --dirt-dark: #a06a3c;
    --star: #ffffff;
    --moon: #fff3b0;
    --night: 0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #10181f;
      --ink: #e4f2e8;
      --muted: #9db8a8;
      --panel: #18232c;
      --line: #6cc36b;
      --accent: #f2b36b;
      --sky-top: #0e1a33;
      --sky-bottom: #283a63;
      --cloud: #53638a;
      --grass: #3f8e4a;
      --grass-dark: #2c6a36;
      --dirt: #7b5534;
      --dirt-dark: #5c3e25;
      --night: 1;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10181f;
    --ink: #e4f2e8;
    --muted: #9db8a8;
    --panel: #18232c;
    --line: #6cc36b;
    --accent: #f2b36b;
    --sky-top: #0e1a33;
    --sky-bottom: #283a63;
    --cloud: #53638a;
    --grass: #3f8e4a;
    --grass-dark: #2c6a36;
    --dirt: #7b5534;
    --dirt-dark: #5c3e25;
    --night: 1;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "VT323", ui-monospace, "Courier New", monospace;
    font-size: 22px;
    line-height: 1.3;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 28px 40px;
    display: grid;
    gap: 18px;
  }
  header { display: grid; gap: 8px; }
  h1 {
    font-family: "Press Start 2P", ui-monospace, monospace;
    font-size: clamp(18px, 4vw, 28px);
    line-height: 1.4;
    margin: 0;
    text-wrap: balance;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }

  .stage {
    position: relative;
    border: 4px solid var(--line);
    box-shadow: 6px 6px 0 var(--line);
    overflow: hidden;
    background: var(--sky-bottom);
    cursor: pointer;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .hud {
    position: absolute;
    top: 8px;
    left: 10px;
    font-family: "Press Start 2P", ui-monospace, monospace;
    font-size: 10px;
    color: #1f3b2a;
    background: rgba(255, 255, 255, 0.75);
    padding: 6px 8px;
    border: 2px solid #1f3b2a;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 16px;
    align-items: center;
  }
  button {
    font-family: "Press Start 2P", ui-monospace, monospace;
    font-size: 11px;
    color: var(--ink);
    background: var(--panel);
    border: 3px solid var(--line);
    box-shadow: 3px 3px 0 var(--line);
    padding: 10px 12px;
    cursor: pointer;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button[aria-pressed="true"] { background: var(--accent); color: #1f3b2a; }
  label.speed { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { accent-color: var(--accent); width: 140px; max-width: 40vw; }
  .tip { color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>Dino <span>Jalan-Jalan</span></h1>
    <p>Si Dino jalan santai dari kanan ke kiri, lalu muncul lagi dari kanan. Klik atau ketuk layar supaya dia melompat.</p>
  </header>

  <div class="stage" id="stage" role="img" aria-label="Animasi dino pixel berwarna hijau berjalan dari kanan ke kiri di atas rumput">
    <canvas id="scene"></canvas>
    <div class="hud" id="hud">LANGKAH 0000</div>
  </div>

  <div class="controls">
    <button id="pause" type="button" aria-pressed="false">Jeda</button>
    <button id="mode" type="button" aria-pressed="false">Mode: terus ke kiri</button>
    <button id="jump" type="button">Lompat</button>
    <label class="speed" for="speed">Kecepatan
      <input id="speed" type="range" min="0.5" max="3" step="0.25" value="1">
    </label>
  </div>
  <p class="tip">Tips: tombol spasi juga bikin Dino melompat.</p>
</div>

<script>
(() => {
  // ---------- Sprite (menghadap kanan; dibalik saat jalan ke kiri) ----------
  const BODY = [
    "..............DDDDDD....",
    ".............DGGGGGGD...",
    "............DGGGGGGGGD..",
    "............DGGGGWWGGGD.",
    "............DGGGGWKGGGD.",
    "............DGGGGGGGGGD.",
    "............DGGGGGPPGGD.",
    "............DGGGGDDDDDD.",
    ".....S.S.S..DGGGGD......",
    "....DSDSDSDDGGGGGD......",
    "...DGGGGGGGGGGLLGDD.....",
    "D.DGGGGGGGGGGLLLGGGD....",
    "DDGGGGGGGGGGGLLLGDD.....",
    ".DGGGGGGGGGGGLLGD.......",
    "..DDGGGGGGGGGGGD........",
    "....DGGGDDDDGGGD........",
  ];
  const LEGS = [
    ["....DGGD....DGGD........",
     "....DGGD....DGGD........",
     "....DDDD....DDDD........"],
    ["...DGGD......DGGD.......",
     "...DDDD......DGGD.......",
     ".............DDDD......."],
  ];
  const BLINK_ROWS = { 3: "............DGGGGGGGGGD.", 4: "............DGGGGDDGGGD." };
  const SPRITE_W = 24, SPRITE_H = BODY.length + 3;
  const PAL = {
    D: "#1f3b2a", G: "#6cc36b", L: "#f4e3a1", W: "#ffffff",
    K: "#1f3b2a", P: "#f59bb0", S: "#f2994a",
  };

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");
  const hud = document.getElementById("hud");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const H = 70;            // tinggi dunia dalam "pixel" logis
  const GROUND = 56;       // garis tanah
  let P = 4, W = 200;      // ukuran pixel & lebar dunia

  let colors = {};
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const v = (n) => cs.getPropertyValue(n).trim();
    colors = {
      skyTop: v("--sky-top"), skyBottom: v("--sky-bottom"), cloud: v("--cloud"),
      grass: v("--grass"), grassDark: v("--grass-dark"), dirt: v("--dirt"), dirtDark: v("--dirt-dark"),
      star: v("--star"), moon: v("--moon"), night: v("--night") === "1",
    };
  }

  // ---------- Dunia ----------
  let clouds = [], stars = [], deco = [];
  function rand(a, b) { return a + Math.random() * (b - a); }
  function buildWorld() {
    clouds = Array.from({ length: Math.max(3, Math.round(W / 70)) }, () => ({
      x: rand(0, W), y: Math.round(rand(4, 24)), w: Math.round(rand(14, 26)), v: rand(1.5, 4),
    }));
    stars = Array.from({ length: Math.round(W / 6) }, () => ({ x: Math.round(rand(0, W)), y: Math.round(rand(2, 40)), t: rand(0, 6) }));
    deco = [];
    for (let x = 6; x < W; x += Math.round(rand(18, 40))) {
      deco.push({ x, kind: Math.random() < 0.3 ? "cactus" : (Math.random() < 0.5 ? "flower" : "tuft") });
    }
  }

  function resize() {
    const cssW = stage.clientWidth;
    P = cssW < 520 ? 4 : 6;
    W = Math.ceil(cssW / P);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W * P + "px";
    canvas.style.height = H * P + "px";
    buildWorld();
    if (dino.x > W) dino.x = W;
  }

  function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }

  function drawSky(t) {
    const bands = 6;
    for (let i = 0; i < bands; i++) {
      ctx.fillStyle = mix(colors.skyTop, colors.skyBottom, i / (bands - 1));
      ctx.fillRect(0, Math.floor((GROUND * i) / bands), W, Math.ceil(GROUND / bands) + 1);
    }
    if (colors.night) {
      for (const s of stars) {
        if (Math.sin(t * 2 + s.t) > -0.3) px(s.x, s.y, 1, 1, colors.star);
      }
      px(W - 30, 10, 8, 8, colors.moon);
      px(W - 31, 11, 1, 6, colors.moon);
      px(W - 22, 11, 1, 6, colors.moon);
      px(W - 27, 11, 3, 2, colors.skyTop);
    } else {
      px(W - 30, 8, 10, 10, "#ffd65c");
      px(W - 31, 10, 12, 6, "#ffd65c");
    }
    for (const c of clouds) {
      const x = Math.round(c.x), y = c.y, w = c.w;
      px(x, y + 2, w, 3, colors.cloud);
      px(x + 3, y, Math.round(w * 0.45), 2, colors.cloud);
      px(x + Math.round(w * 0.5), y + 1, Math.round(w * 0.3), 1, colors.cloud);
    }
  }

  function drawGround(offset) {
    px(0, GROUND, W, H - GROUND, colors.dirt);
    px(0, GROUND, W, 3, colors.grass);
    for (let x = 0; x < W; x += 4) px(x, GROUND + 3, 2, 1, colors.grassDark);
    for (let x = 1; x < W; x += 7) px(x, GROUND + 8 + ((x * 7) % 9), 2, 1, colors.dirtDark);
    for (const d of deco) {
      const x = d.x;
      if (d.kind === "tuft") {
        px(x, GROUND - 2, 1, 2, colors.grassDark); px(x + 2, GROUND - 3, 1, 3, colors.grassDark); px(x + 4, GROUND - 2, 1, 2, colors.grassDark);
      } else if (d.kind === "flower") {
        px(x + 1, GROUND - 3, 1, 3, colors.grassDark);
        px(x, GROUND - 5, 3, 1, "#f59bb0"); px(x + 1, GROUND - 6, 1, 3, "#f59bb0"); px(x + 1, GROUND - 5, 1, 1, "#ffd65c");
      } else {
        px(x + 2, GROUND - 10, 3, 10, colors.grassDark);
        px(x, GROUND - 7, 2, 1, colors.grassDark); px(x, GROUND - 9, 1, 3, colors.grassDark);
        px(x + 5, GROUND - 5, 2, 1, colors.grassDark); px(x + 6, GROUND - 8, 1, 4, colors.grassDark);
      }
    }
  }

  function drawDino(x, y, facingLeft, frame, blink) {
    const rows = BODY.map((r, i) => (blink && BLINK_ROWS[i]) ? BLINK_ROWS[i] : r).concat(LEGS[frame]);
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === ".") continue;
        const dx = facingLeft ? SPRITE_W - 1 - c : c;
        px(x + dx, y + r, 1, 1, PAL[ch]);
      }
    }
  }

  function drawShadow(x, lift) {
    const w = Math.max(8, 16 - Math.round(lift / 2));
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(Math.round(x + (SPRITE_W - w) / 2), GROUND, w, 1);
  }

  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
    const g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
    const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
    return `rgb(${r},${g},${bl})`;
  }

  // ---------- Status dino ----------
  const dino = { x: 0, dir: -1, frame: 0, frameTime: 0, lift: 0, vy: 0, steps: 0, blinkT: 2, blinking: 0 };
  const hearts = [];
  let speed = 1, paused = false, bounce = false;

  function jump() {
    if (dino.lift > 0) return;
    dino.vy = 60;
    hearts.push({ x: dino.x + SPRITE_W / 2, y: GROUND - SPRITE_H - 4, life: 1.2 });
  }

  function drawHeart(h) {
    const x = Math.round(h.x), y = Math.round(h.y), c = "#e8577a";
    px(x - 2, y, 2, 1, c); px(x + 1, y, 2, 1, c);
    px(x - 3, y + 1, 7, 2, c);
    px(x - 2, y + 3, 5, 1, c);
    px(x - 1, y + 4, 3, 1, c);
    px(x, y + 5, 1, 1, c);
  }

  let last = performance.now(), colorTimer = 0;
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    colorTimer -= dt;
    if (colorTimer <= 0) { readColors(); colorTimer = 0.5; }

    if (!paused) {
      dino.x += dino.dir * 16 * speed * dt;
      if (bounce) {
        if (dino.x < 2) { dino.x = 2; dino.dir = 1; }
        if (dino.x > W - SPRITE_W - 2) { dino.x = W - SPRITE_W - 2; dino.dir = -1; }
      } else {
        dino.dir = -1;
        if (dino.x < -SPRITE_W) dino.x = W;
      }
      dino.frameTime += dt * speed;
      if (dino.frameTime > 0.22) {
        dino.frameTime = 0; dino.frame ^= 1; dino.steps++;
        hud.textContent = "LANGKAH " + String(dino.steps).padStart(4, "0");
      }
      if (!reduceMotion) for (const c of clouds) { c.x -= c.v * dt; if (c.x < -c.w) c.x = W; }
    }
    if (dino.lift > 0 || dino.vy > 0) {
      dino.lift += dino.vy * dt;
      dino.vy -= 180 * dt;
      if (dino.lift <= 0) { dino.lift = 0; dino.vy = 0; }
    }
    dino.blinkT -= dt;
    if (dino.blinkT <= 0) { dino.blinking = 0.14; dino.blinkT = rand(2, 5); }
    if (dino.blinking > 0) dino.blinking -= dt;
    for (const h of hearts) { h.y -= 14 * dt; h.life -= dt; }
    while (hearts.length && hearts[0].life <= 0) hearts.shift();

    ctx.clearRect(0, 0, W, H);
    drawSky(now / 1000);
    drawGround();
    const bob = (!paused && !reduceMotion && dino.frame === 1 && dino.lift === 0) ? 1 : 0;
    drawShadow(dino.x, dino.lift);
    drawDino(dino.x, GROUND - SPRITE_H - Math.round(dino.lift) + bob, dino.dir < 0, paused ? 0 : dino.frame, dino.blinking > 0);
    for (const h of hearts) drawHeart(h);
    requestAnimationFrame(tick);
  }

  // ---------- Kontrol ----------
  const pauseBtn = document.getElementById("pause");
  const modeBtn = document.getElementById("mode");
  pauseBtn.addEventListener("click", () => {
    paused = !paused;
    pauseBtn.textContent = paused ? "Lanjut" : "Jeda";
    pauseBtn.setAttribute("aria-pressed", String(paused));
  });
  modeBtn.addEventListener("click", () => {
    bounce = !bounce;
    modeBtn.textContent = bounce ? "Mode: bolak-balik" : "Mode: terus ke kiri";
    modeBtn.setAttribute("aria-pressed", String(bounce));
  });
  document.getElementById("jump").addEventListener("click", jump);
  stage.addEventListener("click", jump);
  document.getElementById("speed").addEventListener("input", (e) => { speed = parseFloat(e.target.value); });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && e.target === document.body) { e.preventDefault(); jump(); }
  });
  window.addEventListener("resize", resize);

  readColors();
  resize();
  dino.x = W - SPRITE_W - 10;
  requestAnimationFrame(tick);
})();
</script>
</body></html>
